name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  checks: write

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect e2e-relevant changes
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for e2e-relevant changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            e2e:
              - "e2e/**"
              - "!e2e/screenshots/**"
              - "!e2e/videos/**"
              - "frontend/**"
              - "backend/**"
              - ".github/workflows/e2e.yml"

  e2e:
    name: playwright
    needs: changes
    # Wrapper job: the workflow always triggers (no `paths:` filter above) so
    # this check name is always reported for a required-status-check to
    # attach to, but the real work only runs when e2e-relevant files changed.
    # GitHub treats a skipped required check as passing.
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
          prune-cache: false

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock', 'e2e/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/bun.lock') }}

      - name: Install backend deps
        run: uv sync --group dev
        working-directory: ./backend

      - name: Install frontend deps
        run: bun install --frozen-lockfile
        working-directory: ./frontend

      - name: Install e2e deps
        run: bun install --frozen-lockfile
        working-directory: ./e2e

      - name: Install browser binaries
        run: bunx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ./e2e

      - name: Install browser OS dependencies only
        run: sudo env "PATH=$PATH" bunx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: ./e2e

      - name: Run e2e tests
        run: bun run test
        working-directory: ./e2e

      # The rest of this job captures PR screenshots and a reorder-flow
      # video for reviewer convenience. It only makes sense — and only has
      # somewhere to commit/comment to — on a pull_request event.
      - name: Run screenshot capture
        if: github.event_name == 'pull_request'
        run: bun run screenshots
        working-directory: ./e2e

      - name: Run reorder video capture
        if: github.event_name == 'pull_request'
        run: bun run videos
        working-directory: ./e2e

      - name: Upload screenshots artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-screenshots
          path: e2e/screenshots/*.png

      - name: Upload video artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-reorder-video
          path: e2e/videos/*.webm

      # GitHub's comment sanitizer strips <video src="..."> for any src
      # outside its own private upload CDN, so a linked/embedded .webm never
      # actually plays inline in a comment. Converting to a GIF sidesteps
      # that: GitHub renders GIFs as plain <img> (like the screenshots) and
      # they autoplay, giving an inline preview without a click-through
      # download.
      - name: Install ffmpeg
        if: github.event_name == 'pull_request'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Convert video to GIF preview
        if: github.event_name == 'pull_request'
        run: ffmpeg -i videos/reorder-dnd.webm -vf "fps=12,scale=640:-1:flags=lanczos" videos/reorder-dnd.gif

      # Commits the freshly captured screenshots and GIF preview back onto
      # the PR branch in a single commit so they can be viewed inline (via
      # raw.githubusercontent.com) instead of only as downloadable CI
      # artifacts. The full-quality .webm stays out of the branch (see
      # .gitignore) and is only available via the uploaded artifact above.
      # Skipped for forked PRs, since the default GITHUB_TOKEN can't push to
      # a fork's branch.
      #
      # Loop safety: this workflow excludes e2e/screenshots/** and
      # e2e/videos/** from its own trigger paths, and pushes made with the
      # default GITHUB_TOKEN never trigger workflow runs anyway. Do NOT add
      # "[skip ci]" here — squash-merging folds this message into the merge
      # commit body, which then skips every workflow on the push to main.
      - name: Commit and push updated media
        id: commit_media
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add e2e/screenshots/*.png e2e/videos/*.gif
          if git diff --cached --quiet; then
            echo "No media changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update PR screenshots and reorder video preview"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "new_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # e2e/screenshots/** and e2e/videos/** are excluded from every
      # workflow's trigger paths (so the commit above doesn't re-trigger
      # CI), which means the new PR head SHA it creates never gets any
      # check runs of its own. GitHub's required-status-checks rule then
      # shows that SHA as permanently "Expected — waiting for status to be
      # reported" and blocks merging, even though the only diff from the
      # tested commit is generated screenshots/video. Mirror the required
      # checks' conclusions from the tested SHA onto the new one so the PR
      # reports green and stays mergeable.
      - name: Mirror required status checks onto media commit
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.commit_media.outputs.pushed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const newSha = "${{ steps.commit_media.outputs.new_sha }}";
            const oldSha = context.payload.pull_request.head.sha;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // "lint & type check" and "Run frontend checks" run in sibling
            // workflows triggered by the same pull_request event; copy
            // whatever conclusion they already reached for the tested SHA.
            const mirroredChecks = ["Run frontend checks", "lint & type check"];
            for (const name of mirroredChecks) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: oldSha,
                check_name: name,
              });
              const run = data.check_runs.find((r) => r.status === "completed");
              if (!run) {
                core.warning(`No completed check run named "${name}" found for ${oldSha}; skipping mirror`);
                continue;
              }
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name,
                head_sha: newSha,
                status: "completed",
                conclusion: run.conclusion,
                details_url: run.html_url,
                output: {
                  title: name,
                  summary: `Mirrored from ${oldSha} (${run.html_url}) — this commit only adds generated screenshots/video, no source changes.`,
                },
              });
            }

            // "playwright" is this job's own required check, still
            // in-progress against oldSha at this point. Reaching this step
            // means the "Run e2e tests" step above already succeeded, so
            // report the same success for the new SHA directly.
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "playwright",
              head_sha: newSha,
              status: "completed",
              conclusion: "success",
              details_url: runUrl,
              output: {
                title: "playwright",
                summary: `Mirrored from this run (tested against ${oldSha}) — this commit only adds generated screenshots/video, no source changes.`,
              },
            });

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- pr-media-bot -->";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const branch = context.payload.pull_request.head.ref;
            const isFork = context.payload.pull_request.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`;

            const screenshotFiles = fs
              .readdirSync("e2e/screenshots")
              .filter((f) => f.endsWith(".png"))
              .sort();
            const videoFiles = fs
              .readdirSync("e2e/videos")
              .filter((f) => f.endsWith(".gif"))
              .sort();

            let body;
            if (isFork) {
              const list = [...screenshotFiles, ...videoFiles].map((f) => `- \`${f}\``).join("\n");
              body = `${marker}\n### PR media\n\nCaptured for this PR, but not committed back (forked PR): [view run](${runUrl})\n\n${list}\n`;
            } else {
              const screenshotsRawBase = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${branch}/e2e/screenshots`;
              const videosRawBase = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${branch}/e2e/videos`;
              const images = screenshotFiles
                .map((f) => `**${f}**\n\n![${f}](${screenshotsRawBase}/${f})`)
                .join("\n\n");
              const gifs = videoFiles.map((f) => `![${f}](${videosRawBase}/${f})`).join("\n\n");
              body =
                `${marker}\n### Screenshots\n\nUpdated for this PR: [view run](${runUrl})\n\n${images}\n\n` +
                `### Drag-and-drop queue reorder video\n\nGIF preview, no audio/controls — download the \`pr-reorder-video\` artifact from the run for the full-quality \`.webm\`:\n\n${gifs}\n`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
