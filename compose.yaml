services:
  karaoke:
    image: ghcr.io/jackrr/karaoke:latest
    build: .
    restart: unless-stopped
    ports:
      - "${KARAOKE_PORT:-8765}:8000"
    # Requires nvidia-container-toolkit on the host. On Compose older than
    # v2.30, replace `gpus: all` with:
    #   deploy:
    #     resources:
    #       reservations:
    #         devices:
    #           - driver: nvidia
    #             count: all
    #             capabilities: [gpu]
    gpus: all
    environment:
      DATABASE_PATH: /data/karaoke.db
      STORAGE_DIR: /data/storage
      # DEMUCS_DEVICE: cpu
      # YOUTUBE_COOKIES_FILE: /secrets/cookies.txt
    volumes:
      - ${KARAOKE_DATA_DIR:-./karaoke-data}:/data
      # - ./cookies.txt:/secrets/cookies.txt:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
